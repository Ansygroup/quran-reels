name: Isolated application tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked application dependencies and isolated test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/qr-test-deps" --no-save --ignore-scripts --no-audit --no-fund jsdom@24.1.3 @electric-sql/pglite@0.5.16
      - name: Run mocked application tests
        env:
          NODE_PATH: ${{ runner.temp }}/qr-test-deps/node_modules
        run: npm run pretest
      - name: Run account DOM and isolated database tests
        env:
          NODE_PATH: ${{ runner.temp }}/qr-test-deps/node_modules
        run: |
          node tests/publish_client_dom.js
          node tests/account_concurrency_draft_test.js
          node tests/autopilot_settings_guard_db_test.js

  account-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        width: [390, 1280]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise account UI with mocked network
        env:
          REEL_TEST_WIDTH: ${{ matrix.width }}
        run: |
          node tests/account_save_uncertain_browser_test.js
          node tests/account_reel_browser_test.js
