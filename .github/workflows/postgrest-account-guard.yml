name: Isolated PostgREST account guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create isolated fixture and additive database functions
        shell: bash
        run: |
          set -euo pipefail
          pg='${{ job.services.postgres.id }}'
          for file in \
            tests/postgrest_fixture.sql \
            sql/migrations/20261107_private_backgrounds.sql \
            sql/migrations/20261113_guarded_autopilot_settings.sql \
            sql/migrations/20261114_guarded_autopilot_actions.sql; do
            docker exec -i "$pg" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Start local PostgREST
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --network host --name qr-local-postgrest \
            -e PGRST_DB_URI='postgres://authenticator:local-fixture-only@127.0.0.1:5432/postgres' \
            -e PGRST_DB_SCHEMAS='public' \
            -e PGRST_DB_ANON_ROLE='anon' \
            -e PGRST_SERVER_HOST='127.0.0.1' \
            -e PGRST_SERVER_PORT='3101' \
            -e PGRST_JWT_SECRET='LOCAL-ONLY-postgrest-fixture-secret-0123456789-abcdef' \
            postgrest/postgrest:v12.2.3
      - name: Exercise foundation over HTTP
        run: node tests/postgrest_guard_http_test.js foundation
      - name: Apply candidate ACLs in disposable container only
        shell: bash
        run: |
          set -euo pipefail
          pg='${{ job.services.postgres.id }}'
          for file in \
            sql/operations/candidate_autopilot_client_write_revoke.sql \
            sql/operations/candidate_autopilot_service_guard.sql; do
            docker exec -i "$pg" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Exercise guarded HTTP and concurrency
        run: node tests/postgrest_guard_http_test.js guarded
      - name: Local PostgREST log on failure
        if: failure()
        run: docker logs qr-local-postgrest || true
      - name: Stop local PostgREST
        if: always()
        run: docker stop qr-local-postgrest || true
